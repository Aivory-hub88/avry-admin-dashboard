name: admin-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # vitest suite + the node:test guardrails in tests/*.test.mjs
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # next.config.ts refuses a production build without it; any URL works here.
          NEXT_PUBLIC_API_URL: https://api.example.com
